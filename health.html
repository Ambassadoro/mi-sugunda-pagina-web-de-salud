<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastering Positivity</title>
    <style>

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://desu.shikimori.one/system/user_images/original/655381/1236728.jpg'); 
            background-size: cover;
            background-position: center;
            opacity: 0.5; 
            z-index: -1;
        }

        .content {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        #title {
            font-size: 2em;
            margin: 20px;
        }

        .phrase-box {
            margin: 20px;
            padding: 10px;
            border: 2px solid black;
            animation: flash 1s infinite alternate;
        }

        @keyframes flash {
            from { background-color: #ff8a80; }
            to { background-color: #ffd180; }
        }

        .flashing-text {
            font-size: 1.5em;
            font-weight: bold;
        }

        .bold-text {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            text-shadow: 2px 2px 4px #aaa;
        }

        #backgroundButton {
            padding: 10px 20px;
            font-size: 1em;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #backgroundButton:hover {
            background-color: #42a5f5; 
        }

        footer {
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div id="background"></div>
    <div class="content">
        <h1 id="title">Mastering Positivity</h1>

        <div class="phrase-box">
            <p class="flashing-text">unlock happier</p>
        </div>

        <p class="bold-text">and succesful life</p>

        <button id="backgroundButton" onclick="showBackground()">Переглянути фон</button>

        <footer>
            <p>Виконав: Зельніченко Михайло</p>
        </footer>
    </div>

    <script>
        const title = document.getElementById('title');
        let titleText = title.innerHTML;
        title.innerHTML = "";
        let i = 0;

        function typeTitle() {
            if (i < titleText.length) {
                title.innerHTML += titleText.charAt(i);
                i++;
                setTimeout(typeTitle, 100); 
            }
        }
        typeTitle();

        function showBackground() {
            const background = document.getElementById('background');
            background.style.opacity = "1";
        }
    </script>
</body>
</html>
